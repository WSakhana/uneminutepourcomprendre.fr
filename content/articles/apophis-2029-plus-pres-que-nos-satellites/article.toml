lead = "Le 13 avril 2029, un astéroïde de quelques centaines de mètres passera plus près de la Terre que les satellites géostationnaires. Les calculs de la NASA donnent l'heure, la distance et la vitesse de ce passage. Que va-t-il se passer exactement, et pourquoi n'y a-t-il aucune raison de s'inquiéter ?"
