method = "Cet article reprend et développe un Short sans narration : le contenu de la vidéo est dans ses textes à l'écran. La vidéo est une animation de données, pas une vidéo générée par IA : les positions d'Apophis, de la Lune et du Soleil viennent des éphémérides JPL Horizons, la Terre est texturée avec les images Blue Marble et Black Marble de la NASA, et la bande son est une musique de catalogue, sans voix. Les chiffres de l'approche ont été relus le 3 octobre 2026 dans l'API Close Approach Data du JPL ; la magnitude d'environ 3,1 et les éléments d'orbite viennent d'une requête Horizons du même jour. La page de la NASA de 2021 refuse les requêtes automatiques : son contenu a été lu via un outil de consultation, pas dans un navigateur."
