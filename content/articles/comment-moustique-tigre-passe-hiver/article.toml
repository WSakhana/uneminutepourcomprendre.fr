description = "Comment le moustique tigre passe-t-il l'hiver ? Jours courts, œufs en diapause, résistance au sec et éclosion : le mécanisme expliqué et ses limites."
lead = "En France métropolitaine, le moustique tigre peut traverser l'hiver au stade d'œuf. Cette attente se prépare dès l'automne : les jours courts perçus par la mère favorisent la diapause de sa descendance. Que se passe-t-il dans ces œufs, et qu'est-ce qui permet ensuite l'éclosion ?"
