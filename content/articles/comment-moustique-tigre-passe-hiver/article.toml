slug = "comment-moustique-tigre-passe-hiver"
title = "Moustique tigre : comment il prépare l’hiver"
short_title = "Le moustique tigre en hiver"
category = "Nature"
description = "Comment le moustique tigre passe-t-il l'hiver ? Jours courts, œufs en diapause, résistance au sec et éclosion : le mécanisme expliqué et ses limites."
lead = "En France métropolitaine, le moustique tigre peut traverser l'hiver au stade d'œuf. Cette attente se prépare dès l'automne : les jours courts perçus par la mère favorisent la diapause de sa descendance. Que se passe-t-il dans ces œufs, et qu'est-ce qui permet ensuite l'éclosion ?"
published = "2026-10-07"
modified = "2026-10-12"
cover = "miniature"
keywords = ["moustique tigre hiver", "Aedes albopictus", "diapause", "œufs de moustique", "photopériode", "résistance au sec", "éclosion", "France métropolitaine"]
production = "D:/@UMPC-Shorts-Reactions/Videos/26 - Comment le moustique tigre prépare l hiver"
video_file = "Montage/UMPC-R 26 - Comment le moustique tigre prepare l hiver.mp4"
chapters = []
method = "Cet article développe le Short publié le 7 octobre 2026. Le titre, la date et la miniature publique ont été vérifiés sur YouTube le même jour. Les deux études de PLOS ont été consultées en texte intégral ; leurs titres, auteurs, dates et DOI ont été vérifiés dans Crossref. Les pages de l'Anses et du CDC apportent le contexte du cycle de vie. Les photographies sont créditées individuellement. La coupe d'œuf extraite de la vidéo est une illustration générée, pas une observation anatomique. La photographie de larve, présente dans le dossier comme référence de production, est utilisée ici avec son crédit propre."

