short_title = "Pourquoi la tique passe inaperçue"
category = "Animaux"
description = "Pourquoi une piqûre de tique passe-t-elle souvent inaperçue ? Ancrage, salive, signaux de douleur et rôle de Salp15 dans les études sur Lyme."
lead = "Une tique peut rester fixée à la peau pendant plusieurs jours sans attirer l'attention. Comment tient-elle aussi longtemps, et pourquoi la piqûre fait-elle souvent si peu mal ? Sa salive agit sur plusieurs réactions de défense, avec des mécanismes qui varient selon les espèces."
