slug = "animaux-squelettes-etonnants"
title = "10 animaux aux squelettes étonnants : des os aux carapaces"
short_title = "Dix squelettes animaux étonnants"
category = "Animaux"
description = "Hippocampe, tortue, requin, girafe… Dix animaux révèlent la diversité des squelettes : os, cartilage, carapaces et pièces calcaires. Deux vidéos et les sources."
lead = "Une aile de chauve-souris et une nageoire de baleine ont des os en commun avec notre bras. Un requin possède un squelette sans os, tandis qu'une étoile de mer assemble de petites pièces calcaires. Les deux vidéos de cette série explorent dix animaux : voici ce que leurs squelettes racontent, au-delà des apparences."
published = "2026-10-12"
modified = "2026-10-12"
cover = "couverture"
production = "D:/@UMPC/Videos/22 - 5 animaux aux squelettes vraiment bizarres"
video_file = "Montage/UMPC 22 - 5 animaux aux squelettes vraiment b/UMPC 22 - 5 animaux aux squelettes vraiment b.mp4"
chapters = []
keywords = ["squelettes animaux", "anatomie comparée", "squelette requin", "carapace tortue", "vertèbres girafe", "aile chauve-souris", "squelette étoile de mer", "urostyle grenouille"]
method = "Cet article réunit les deux Shorts de la série. Les titres, les dates de publication et les miniatures publiques ont été vérifiés sur YouTube le 12 octobre 2026 : première partie le 13 septembre, seconde le 2 octobre. Les durées viennent des exports finaux locaux. Les images de scène déjà produites ont été recadrées pour l'article ; ce sont des illustrations générées, et non des radiographies ou des documents permettant de compter les pièces squelettiques. La couverture reprend la miniature publique de la première partie. Les pages institutionnelles et les textes des études de Newman et Jayne, Krings et collègues, Richards et collègues et Senevirathne et collègues ont été consultés ; pour Porter et collègues, le résumé de la publication et le communiqué de l'UC San Diego ont été lus. Les métadonnées des études ont été recoupées avec Europe PMC et les publications. Deux références originales sur l'effraie et le développement de l'urostyle complètent les dossiers afin de préciser les simplifications des Shorts."

